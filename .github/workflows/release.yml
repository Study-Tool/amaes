name: Build and Release Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run OPSEC identity check
        run: bash extension/scripts/check-identity.sh

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Run tests, typecheck, and build packages
        working-directory: extension
        run: |
          npm test
          npm run typecheck
          npm run zip
          npm run zip:firefox

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension/.output/*-chrome.zip
            extension/.output/*-firefox.zip
            extension/.output/*-sources.zip
          generate_release_notes: true
